<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620" font-family="Inter, Arial, sans-serif">
  <rect width="620" height="620" fill="#0d1117"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="60" y="16" width="500" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="310" y="49" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Raw URL Dataset (UCI Phishing, 11,055 URLs)</text>

  <line x1="310" y1="70" x2="310" y2="100" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="102" width="500" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="310" y="129" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">MongoDB ingestion (pymongo)</text>

  <line x1="310" y1="146" x2="310" y2="176" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="178" width="500" height="56" rx="8" fill="#161b22" stroke="#6366f1" stroke-width="1.5"/>
  <text x="310" y="203" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">Schema Validation + KS Drift Test</text>
  <text x="310" y="221" text-anchor="middle" fill="#8b949e" font-size="10">triggers retraining if drift p-value &lt; 0.05 on 3+ features</text>

  <line x1="310" y1="234" x2="310" y2="264" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="266" width="500" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="310" y="288" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">30 URL Feature Signals</text>
  <text x="80" y="308" fill="#8b949e" font-size="10">SSL certificate state, anchor link targets, web traffic rank</text>
  <text x="80" y="326" fill="#8b949e" font-size="10">IP in URL, domain age, redirect chains, form submission target</text>
  <text x="80" y="344" fill="#8b949e" font-size="10">Shortening service, favicon source, DNS record, blacklist status</text>

  <line x1="310" y1="366" x2="310" y2="396" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="398" width="500" height="80" rx="8" fill="#161b22" stroke="#6366f1" stroke-width="1.5"/>
  <text x="310" y="422" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">RandomForest Classifier</text>
  <text x="310" y="440" text-anchor="middle" fill="#8b949e" font-size="10">best of 5 algorithms via GridSearchCV</text>
  <text x="310" y="458" text-anchor="middle" fill="#8b949e" font-size="10">RandomForest / GradientBoosting / AdaBoost / DecisionTree / LogisticRegression</text>

  <line x1="310" y1="478" x2="310" y2="508" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="510" width="500" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="310" y="537" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">MLflow Experiment Registry</text>

  <line x1="310" y1="554" x2="310" y2="584" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="586" width="500" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="310" y="606" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="700">FastAPI async REST + React SPA</text>
</svg>
